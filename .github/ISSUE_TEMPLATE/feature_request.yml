name: 功能建议 Feature request
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你希望解决什么问题 / 场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其它想法（可选）
