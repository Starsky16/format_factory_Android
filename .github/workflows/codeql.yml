# 自定义 CodeQL：修复 java-kotlin 分析（CI 缺 android/local.properties 导致 Gradle 失败）
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle 需要 android/local.properties；该文件由本机构建时生成、不入库，
      # 这里显式生成（sdk.dir + flutter.sdk），否则 CodeQL 的 java-kotlin 分析会失败。
      - name: Generate android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          FLUTTER_BIN=$(command -v flutter)
          echo "flutter.sdk=$(dirname "$(dirname "$FLUTTER_BIN")")" >> android/local.properties
          cat android/local.properties

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # 手动构建以便 CodeQL 提取 Java/Kotlin 源码
      - name: Build (extraction)
        run: flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
