name: DeepSec

# DeepSec（https://github.com/Unclecheng-li/DeepSec）离线静态审计 + SARIF 上传。
#
# 只跑 L1/L2：两者完全本地推理，不联网、不调用 LLM、不需要 API Key、零成本。
# （L3 会把源码片段发给 LLM 并计费，CI 中一律不启用。）
#
# 扫描范围说明（重要，别被"全绿"误导）—— 实测本机 DeepSec 核心 CLI 支持的扩展名：
#   .py .js .mjs .cjs .ts .tsx .jsx .java .go .rb .php .cs .rs .yaml .yml .json
# 也就是说本工作流实际只覆盖仓库里的 JSON / YAML / 少量工具脚本（pubspec、manifest、
# .github/ 下的工作流等）。**Dart 与 Kotlin 都不在支持范围内**，lib/ 与 android/ 的
# 业务代码不会被扫描，Dart 侧仍靠 flutter analyze + flutter test + 人工审查兜底。
#
# CI 检出的是 git 跟踪的文件，因此本地被 gitignore 的目录（build/、.dart_tool/、
# android/tools/ref/ 等）不会参与扫描，无需额外忽略配置。
#
# 想临时停用：仓库 Settings → Secrets and variables → Actions → Variables
#   新增变量 DEEPSEC_ENABLED = false

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepsec:
    name: DeepSec L1/L2
    runs-on: ubuntu-latest
    if: ${{ vars.DEEPSEC_ENABLED != 'false' }}
    permissions:
      contents: read
      security-events: write # 上传 SARIF 到 Code Scanning 需要

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DeepSec（从上游源码安装，PyPI 未发布）
        run: python -m pip install --disable-pip-version-check "git+https://github.com/Unclecheng-li/DeepSec.git"

      # 有发现时 CLI 可能以非零码退出（"发现即非零"，不代表执行失败）。
      # 这里不让它阻断 PR；是否阻断由是否保留下面这行 continue-on-error 决定。
      - name: Scan（L1/L2，离线）
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p deepsec-out
          deepsec shield scan . --layer l1,l2 --format sarif --output deepsec-out/repo.sarif
          deepsec shield scan . --layer l1,l2 --format markdown --output deepsec-out/report.md

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f deepsec-out/report.md ]; then
            cat deepsec-out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成报告（安装或扫描失败，请查看上一步日志）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF
        if: always()
        # 私有仓库 / 未开启 Code Scanning 时上传会失败，不影响构建结论
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: deepsec-out
          category: deepsec
